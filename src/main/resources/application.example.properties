spring.application.name=ananta

spring.datasource.url={DATABASE  url}
spring.datasource.username={DB Password}
spring.datasource.password={DB Password}

server.servlet.context-path=/ananta/v1

SECRET_KEY = {JWT_SECRET_KEY}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username= {email to send mails}
spring.mail.password= {app password}
spring.mail.properties.mail.smtp.auth=true{for auth}
spring.mail.properties.mail.smtp.starttls.enable=true{transport layer service}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# If using Hibernate 6+ (Spring Boot 3+)
spring.jpa.properties.hibernate.type.descriptor.sql.BinaryTypeDescriptor=REPEATABLE_READ

#Payment test api
RAZORPAY_API_KEY={Test Key}
RAZORPAY_API_SECRET={Test key secret}