spring.application.name=ananta

# This tells Spring to use 'dev' unless an environment variable says otherwise
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.servlet.context-path=/ananta/v1

# Common Multipart settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Common JPA settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.descriptor.sql.BinaryTypeDescriptor=REPEATABLE_READ

server.port=${PORT:8080}

spring.jpa.defer-datasource-initialization=true

# 1. STOP CONNECTIONS ON APPLICATION STARTUP (BYPASSES BOOT VALIDATION)
spring.datasource.hikari.initialization-fail-timeout=-1

# 2. STRIP THE VIEW LAYER OF AUTOMATIC ALLOCATION
spring.jpa.open-in-view=false

# 3. SET THE POOL CAPACITY TO EXACTLY ZERO WHEN INACTIVE
spring.datasource.hikari.minimum-idle=0

# 4. REMOVE INTERNAL LIFETIME CYCLES (TURNS OFF HIKARI HOUSEKEEPING THREADS)
spring.datasource.hikari.idle-timeout=0
spring.datasource.hikari.max-lifetime=0

# 5. COMPLETELY DISABLE BACKGROUND KEEPALIVE AND MONITORING
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-test-query=
